name: FreeClaw Local Engine Tests
on:
  push:
    paths:
      - "local-engine/**"
      - "tests/**"
      - ".github/workflows/local-engine-tests.yml"
  pull_request:
    paths:
      - "local-engine/**"
      - "tests/**"
      - ".github/workflows/local-engine-tests.yml"
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m py_compile local-engine/app.py local-engine/engine.py local-engine/proposal_parser.py
